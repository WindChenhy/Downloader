# Wails v3 构建资源配置（图标/版本信息/开发模式）。修改 info 后需执行
# `wails3 task common:update:build-assets` 重新生成平台资源。
version: '3'

info:
  companyName: "WindChen"
  productName: "Downloader"
  productIdentifier: "com.windchen.downloader"
  description: "多线程下载工具"
  copyright: "(c) 2026, WindChen"
  comments: "Windows 优先的多线程下载工具，v3 支持 Android"
  version: "3.0.0"

# Android 工程生成配置（bundle id 用 build.gradle 里的 applicationId）
# android:
#   bundleID: "com.windchen.downloader"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

# File Associations
fileAssociations:
#  - ext: wails
#    name: Wails

# Other data
other:
  - name: My Other Data
